<!DOCTYPE html>
<!-- auto-deploy pipeline verified via GitHub → Vercel -->
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palm Port Pty Ltd — 業務統合プラットフォーム</title>
  <meta name="description" content="Palm Port Pty Ltd 向け 業務統合プラットフォーム — 予約・ロスター・日報・請求(XERO)・給与を1つに" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.3/Sortable.min.js"></script>
</head>
<body data-biz="tourism">

  <!-- ===== Sidebar ===== -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">🐬</div>
      <div>
        <div class="brand-name">Palm Port</div>
        <div class="brand-sub">Unified Operations</div>
      </div>
    </div>

    <div class="biz-toggle" role="tablist" aria-label="business">
      <button data-biz="tourism" class="active"><span class="dot"></span>旅行業 PDC</button>
      <button data-biz="cleaning"><span class="dot"></span>清掃業 JQC</button>
    </div>

    <nav class="nav">
      <a href="#/dashboard" data-route="dashboard"><span class="ic">📊</span>ダッシュボード</a>
      <div class="nav-group">業務フロー</div>
      <a href="#/bookings"  data-route="bookings"><span class="ic">📥</span>予約入力<span class="step">1</span></a>
      <a href="#/roster"    data-route="roster"><span class="ic">🗓</span>ロスター<span class="step">2</span></a>
      <a href="#/daily"     data-route="daily"><span class="ic">📋</span>日報 Daily<span class="step">3</span></a>
      <a href="#/messaging" data-route="messaging"><span class="ic">✉️</span>自動連絡</a>
      <a href="#/invoicing" data-route="invoicing"><span class="ic">🧾</span>請求 / XERO<span class="step">4</span></a>
      <a href="#/suppliers" data-route="suppliers"><span class="ic">📦</span>サプライヤー支払</a>
      <a href="#/payroll"   data-route="payroll"><span class="ic">💰</span>給与計算<span class="step">5</span></a>
      <a href="#/analytics" data-route="analytics"><span class="ic">📈</span>経営分析</a>
      <div class="nav-group">マスタ</div>
      <a href="#/staff"     data-route="staff"><span class="ic">👥</span>スタッフ・権限</a>
      <a href="#/vehicles"  data-route="vehicles"><span class="ic">🚐</span>車両管理</a>
      <a href="#/tariff"    data-route="tariff"><span class="ic">🏷</span>料金マスタ</a>
      <a href="#/customers" data-route="customers"><span class="ic">🧑‍🤝‍🧑</span>顧客</a>
    </nav>

    <div class="side-foot">
      <button class="btn ghost block" id="btnReset">↺ デモデータ初期化</button>
      <p class="side-note">プロトタイプ — 入力はこの端末に保存されます。</p>
    </div>
  </aside>

  <!-- ===== Main ===== -->
  <div class="main">
    <header class="topbar">
      <button class="burger" id="burger" aria-label="menu">☰</button>
      <div class="crumb-wrap"><span class="crumb-pre">Palm Port /</span> <b id="crumb">ダッシュボード</b></div>
      <div class="spacer"></div>
      <div class="week-pill">📆 21–27 Sep 2026</div>
      <button class="btn-mobile" id="btnMobile">📱 スタッフ携帯画面</button>
    </header>

    <main class="view" id="view"></main>
  </div>

  <!-- scripts: order matters (classic scripts, no build step) -->
  <script src="js/store.js"></script>
  <script src="js/components.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/bookings.js"></script>
  <script src="js/views/roster.js"></script>
  <script src="js/views/daily.js"></script>
  <script src="js/views/messaging.js"></script>
  <script src="js/views/invoicing.js"></script>
  <script src="js/views/suppliers.js"></script>
  <script src="js/views/payroll.js"></script>
  <script src="js/views/analytics.js"></script>
  <script src="js/views/staff.js"></script>
  <script src="js/views/vehicles.js"></script>
  <script src="js/views/tariff.js"></script>
  <script src="js/views/customers.js"></script>
  <script src="js/views/mobile.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
